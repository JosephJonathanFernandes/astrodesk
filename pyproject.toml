[project]
name = "astrodesk"
version = "0.1.0"
description = "A comprehensive Python Flask-based web application for space exploration."
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
authors = [
    {name = "Joseph Jonathan Fernandes", email = "josephjonathanfernandes@gmail.com"}
]
keywords = ["space", "nasa", "flask", "astronomy", "ai"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: Flask",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Astronomy",
]
dependencies = [
    "flask>=3.1.1",
    "groq>=0.29.0",
    "langchain-core>=0.3.68",
    "langchain-groq>=0.3.5",
    "langgraph>=0.5.2",
    "requests>=2.32.4",
    "skyfield>=1.53",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.3.0",
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = []


